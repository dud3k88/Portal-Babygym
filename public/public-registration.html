<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Zapisy — Evolution Academy</title><link rel="stylesheet" href="/public-registration.css"><link rel="stylesheet" href="/brand.css"></head>
<body><header class="public-header"><a href="/zapisy" class="public-brand" aria-label="Evolution Academy"><img id="public-logo" alt="Evolution Academy" hidden><span id="public-brand-fallback">evolution<span>academy</span></span></a><a href="/" class="login-link">Panel rodzica</a></header>
<main><h1>Zapisy na zajęcia</h1><ol class="steps" aria-label="Etapy zapisu"><li data-step="1" aria-current="step"><span>1</span>Zajęcia</li><li data-step="2"><span>2</span>Dziecko</li><li data-step="3"><span>3</span>Rodzic</li></ol>
<form id="public-enrollment" novalidate><p id="form-error" role="alert" hidden></p>
<section id="step-1" class="step-panel" aria-labelledby="step-title-1"><h2 id="step-title-1">Wybierz grupę</h2><label>Lokalizacja<select id="public-location" required><option value="">Wybierz lokalizację</option></select></label><fieldset id="public-groups"><legend>Grupy</legend><div id="public-group-list" aria-live="polite"></div></fieldset><div id="selected-terms" hidden><input type="hidden" name="month" id="public-month"><label id="public-trial-label">Rodzaj zapisu<select id="public-trial" name="trial_id"><option value="">Zapis stały</option></select></label><div id="public-quote" aria-live="polite"></div></div><div class="actions"><button class="primary" type="button" id="to-child" disabled>Dalej →</button></div></section>
<section id="step-2" class="step-panel" aria-labelledby="step-title-2" hidden><h2 id="step-title-2">Dane dziecka</h2><div class="selection-summary" id="child-summary"></div><div class="row"><label>Imię dziecka<input name="child_first_name" autocomplete="given-name" required maxlength="100"></label><label>Nazwisko dziecka<input name="child_last_name" autocomplete="family-name" required maxlength="100"></label></div><label><span id="birth-date-label">Data urodzenia (opcjonalnie)</span><input type="date" name="birth_date"></label><div id="public-questions"></div><div class="actions"><button type="button" class="secondary" data-back="1">← Wstecz</button><button type="button" class="primary" id="to-parent">Dalej →</button></div></section>
<section id="step-3" class="step-panel" aria-labelledby="step-title-3" hidden><h2 id="step-title-3">Konto rodzica</h2><div class="selection-summary" id="parent-summary"></div><div class="row"><label>Imię rodzica<input name="parent_first_name" autocomplete="given-name" required maxlength="100"></label><label>Nazwisko rodzica<input name="parent_last_name" autocomplete="family-name" required maxlength="100"></label></div><label>Email<input type="email" name="email" autocomplete="username" required maxlength="200"></label><label>Numer telefonu<input type="tel" name="phone" autocomplete="tel" required maxlength="30"></label><div class="row"><label>Hasło<input type="password" name="password" autocomplete="new-password" minlength="10" maxlength="200" required><small>Minimum 10 znaków</small></label><label>Powtórz hasło<input type="password" name="password_confirmation" autocomplete="new-password" minlength="10" maxlength="200" required></label></div><div id="public-policies"></div><div id="final-amount"></div><div class="actions"><button type="button" class="secondary" data-back="2">← Wstecz</button><button type="submit" class="primary" id="public-submit">Utwórz konto i zapisz dziecko</button></div><a href="/" class="existing-account">Masz już konto? Zaloguj się</a></section>
</form></main><script type="module" src="/public-registration.js"></script></body></html>
